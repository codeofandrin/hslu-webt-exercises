<!DOCTYPE html>
<html>

<head>
  <meta charset="utf8">
  <title>Übung 2: Max-Funktion</title>
  <script>
    function max(a, b) {
      if (a >= b) {
        return a;
      }
      return b;
    }
  </script>
</head>

<body>
  <p>Die Ausgabe erfolgt im Console-Log: F12</p>
  <script>
    // number
    let a = 23;
    let b = 13;
    let result = max(a, b);

    // boolean
    let a2 = false
    let b2 = true
    let result2 = max(a2, b2)

    let a3 = "a"
    let b3 = "b"
    let result3 = max(a3, b3)

    console.log(result);    // expected: 23
    console.log(result2);   // expected: true
    console.log(result3);   // expected: "b"

  </script>
</body>

</html>

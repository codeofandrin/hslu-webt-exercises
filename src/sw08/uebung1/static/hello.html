<!DOCTYPE html>
<html>

<head>
  <meta charset="utf8">
  <title>Übung 1: Hello World mit Fetch und JSON</title>
</head>

<body>
  <h1>Übung 1: Hello World mit Fetch und JSON</h1>

  <p>Mitteilung: <span id="message"></span></p>
  <button onclick="doRequest()">Zeige Mitteilung</button>
  <script>
    async function doRequest() {
      try {
        const resp = await fetch("./hello.json")
        if (resp.ok) {
          const raw = await resp.text()
          const data = JSON.parse(raw)
          document.getElementById("message").textContent = data.message
        } else {
          throw resp.status
        }
      } catch (error) {
        alert(`fetch failed: ${error}`);
      }
    }
  </script>
</body>

</html>

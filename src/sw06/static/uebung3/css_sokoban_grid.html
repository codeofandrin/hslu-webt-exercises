<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>CSS Soko-Ban</title>
  <style>
    .parent {
      background-image: url(css_sokoban.png);
      background-size: cover;
      width: 700px;
      height: 600px;
      display: grid;
      grid-template-columns: 100px 200px 100px 200px;
      grid-template-rows: 33.333333% 33.333333% 33.333333%;
    }

    .child {
      background: rgb(68, 114, 196);
      width: 200px;
      height: 200px;
    }

    #c1 {
      grid-column: 2;
      grid-row: 2;
    }

    #c2 {
      grid-column: 4;
      grid-row: 2;
    }
  </style>
</head>

<body>
  <div class="parent">
    <div id="c1" class="child"></div>
    <div id="c2" class="child"></div>
  </div>
</body>

</html>

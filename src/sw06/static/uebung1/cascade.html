<!DOCTYPE html>
<html>

<head>

  <style>
    .important {
      color: red !important;
    }

    #id {
      color: orange;
    }

    .class {
      color: green;
    }

    h1 {
      color: blue;
    }

    .later {
      color: violet;
    }
  </style>

</head>

<body>

  <h1 id="id" class="important class later">important</h1>
  <h1 id="id" class="class later">id</h1>
  <h1 class="class">class</h1>
  <h1>h1</h1>
  <h1 class="class later">later</h1>

</body>

</html>
